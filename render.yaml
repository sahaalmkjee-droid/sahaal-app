databases:
  - name: sahaal-db
    databaseName: nexus_db
    user: sahaal_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------
  # 1. Backend Service (FastAPI)
  # ----------------------------------------------------
  - type: web
    name: sahaal-backend
    env: python
    plan: free
    region: oregon
    rootDir: b_end
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sahaal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ----------------------------------------------------
  - type: web
    name: sahaal-frontend
    env: static
    plan: free
    region: oregon
    rootDir: f_end
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sahaal-backend
          property: host
